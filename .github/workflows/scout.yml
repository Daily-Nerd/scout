name: scout

on:
  schedule:
    # every 6 hours, a few minutes past the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "File issues for real. Default is a dry run."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      # True once the scout-notary app secrets are set on the repository.
      HAS_APP_KEY: ${{ secrets.SCOUT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint scout-notary token
        if: env.HAS_APP_KEY == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.SCOUT_APP_ID }}
          private-key: ${{ secrets.SCOUT_APP_PRIVATE_KEY }}

      # Pin third-party actions to the exact revisions used by the verified run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run scout
        # Prefer the scout-notary installation token once configured. Until
        # then the built-in token is enough: search needs no special scope
        # and the issues are filed in this same repository.
        env:
          SCOUT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            uv run scout run --apply
          else
            uv run scout run
          fi

      - name: Persist scout history
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ ! -f data/candidates.jsonl ]; then
            exit 0
          fi
          sha=""
          if git cat-file -e HEAD:data/candidates.jsonl 2>/dev/null; then
            sha="$(git rev-parse HEAD:data/candidates.jsonl)"
          fi
          jq -n \
            --arg message "chore: update scout candidate history" \
            --rawfile content data/candidates.jsonl \
            --arg sha "$sha" \
            '{message: $message, content: ($content | @base64)}
             + (if $sha == "" then {} else {sha: $sha} end)' \
            | gh api \
                --method PUT \
                "repos/${GITHUB_REPOSITORY}/contents/data/candidates.jsonl" \
                --input -
