name: scout

on:
  schedule:
    # every 6 hours, a few minutes past the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "File issues for real. Default is a dry run."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run scout
        # The built-in token is enough: search needs no special scope and the
        # issues are filed in this same repository. No secret to maintain.
        env:
          SCOUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            uv run scout run --apply
          else
            uv run scout run
          fi
