name: scout

on:
  schedule:
    # every 6 hours, a few minutes past the hour
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "File issues for real. Default is a dry run."
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      # True once the scout-notary app secrets are set on the repository.
      HAS_APP_KEY: ${{ secrets.SCOUT_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Mint scout-notary token
        if: env.HAS_APP_KEY == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SCOUT_APP_ID }}
          private-key: ${{ secrets.SCOUT_APP_PRIVATE_KEY }}

      - name: Run scout
        # Prefer the scout-notary installation token once configured. Until
        # then the built-in token is enough: search needs no special scope
        # and the issues are filed in this same repository.
        env:
          SCOUT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            uv run scout run --apply
          else
            uv run scout run
          fi
