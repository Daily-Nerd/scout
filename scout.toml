# scout configuration. Everything the pipeline needs lives here, not in code.

[github]
# Queries run against the GitHub search API, filtered to recent repos.
queries = [
    "topic:agent-memory",
    "topic:ai-memory",
    "topic:memory-mcp",
    "agent memory in:name,description",
]
window_days = 14

[reddit]
# Anonymous public RSS only: one request per subreddit per run, at most
# one request every request_interval_seconds, no login, no cookies.
subreddits = ["AIMemory", "AI_Agents", "agentsofai", "ai-agents", "LocalLLaMA", "mcp"]
# Measured 2026-09-10: a 2s interval got a 429 on the second subreddit.
# 5s keeps a full run under a minute and stays well inside the limit.
request_interval_seconds = 5
# Retry a throttled feed a few times, then stop this run's Reddit scan.
max_rate_limit_retries = 3
contact_url = "https://github.com/Daily-Nerd/scout"

[terms]
# A Reddit candidate must match at least one term from each list,
# case-insensitive.
agentish = ["agent", "agents", "assistant", "autonomous", "mcp", "tool use"]
memoryish = ["memory", "memories", "recall", "remembrance", "context", "checkpoint", "long-term", "knowledge base"]

[atlas]
repo = "neoneye/agent-memory-atlas"
branch = "main"
archive_org = "agent-memory-atlas-archive"

[issues]
# Where candidate issues are filed. Defaults to this repo until the atlas
# org adopts scout.
target_repo = "Daily-Nerd/scout"
label = "scout:candidate"
# Avoid GitHub secondary limits when filing a large candidate batch.
request_interval_seconds = 1
max_rate_limit_retries = 3

[state]
db_path = "state/scout.db"
candidates_path = "data/candidates.jsonl"
