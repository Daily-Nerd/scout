# scout configuration. Everything the pipeline needs lives here, not in code.

[github]
# Queries run against the GitHub search API, filtered to repos pushed
# inside the window. The phrase query must stay quoted: unquoted, GitHub
# ANDs the words anywhere in the name or description.
queries = [
    "topic:agent-memory",
    "topic:ai-memory",
    "topic:memory-mcp",
    "\"agent memory\" in:name,description",
]
window_days = 14

[reddit]
# Anonymous public RSS only: one request per subreddit per run, at most
# one request every request_interval_seconds, no login, no cookies.
subreddits = ["AIMemory", "AI_Agents", "agentsofai", "ai-agents", "LocalLLaMA", "mcp"]
# Measured 2026-09-10: a 2s interval got a 429 on the second subreddit.
# 5s keeps a full run under a minute and stays well inside the limit.
request_interval_seconds = 5
# Retry a throttled feed a few times, then stop this run's Reddit scan.
max_rate_limit_retries = 3
contact_url = "https://github.com/Daily-Nerd/scout"

[terms]
# A Reddit candidate must match at least one term from each list,
# case-insensitive.
agentish = ["agent", "agents", "assistant", "autonomous", "mcp", "tool use"]
memoryish = ["memory", "memories", "recall", "remembrance", "context", "checkpoint", "long-term", "knowledge base"]

[atlas]
repo = "neoneye/agent-memory-atlas"
branch = "main"
archive_org = "agent-memory-atlas-archive"

[issues]
# Where candidate issues are filed. Defaults to this repo until the atlas
# org adopts scout.
target_repo = "Daily-Nerd/scout"
label = "scout:candidate"
# Stay inside the GitHub content-creation ceiling (near 500 writes an hour)
# and away from secondary limits.
request_interval_seconds = 2
max_rate_limit_retries = 3

[tiering]
# Deterministic candidate scoring, arithmetic only. The score is the sum of
# nine components, each a weight times a 0..1-ish signal:
#   stars         weight * min(stars, stars_cap) / stars_cap
#   recency       weight * max(0, 1 - days_since_push / recency_window_days)
#   name          weight if a memory-ish term appears in the repo name, else 0
#   readme        weight * min(readme_bytes, readme_cap_bytes) / readme_cap_bytes
#   topics        weight * distinct term-list hits across the repo topics
#   density       weight * fraction of description words containing a term
#   tests         weight if the git tree has a tests directory or a
#                 test-named file, else 0
#   source        weight * min(source_files, source_cap) / source_cap, where
#                 source_files counts top-two-level blobs matching
#                 source_extensions
#   list_penalty  -weight when a list_words entry appears as a whole word
#                 (case-insensitive) in the repo name or description, else 0
# A component whose underlying input was never fetched contributes nothing
# to the total (it is absent, not zero). That covers Reddit-sourced
# candidates (no stars, no pushed_at, no topics), repos with no README, no
# description, or a pushed_at that fails to parse, and repos whose git tree
# has not been fetched yet. list_penalty is always present since it needs
# only the repo name and description, which every candidate carries.
# Tiers: score >= tier_a_min files as scout:tier-a, >= tier_b_min as
# scout:tier-b, anything lower is tier C and is not filed.
stars_weight = 2.0
stars_cap = 500
recency_weight = 4.0
recency_window_days = 90
name_weight = 2.0
readme_weight = 2.0
readme_cap_bytes = 20000
topic_weight = 1.0
density_weight = 3.0
tier_a_min = 8.0
tier_b_min = 5.0
tests_weight = 2.0
source_weight = 1.5
source_cap = 40
source_extensions = [".py", ".ts", ".tsx", ".js", ".go", ".rs", ".java", ".kt", ".rb", ".cs", ".cpp", ".c", ".swift"]
list_penalty_weight = 3.0
list_words = ["awesome", "list", "curated", "collection", "resources", "roundup"]
# Fetching a git tree is a per-repo API call, so a first pass over ~1900
# rows at 2s each would take over an hour. This caps how many uncached
# repos get a tree fetch in one run; the rest are picked up next run.
tree_max_per_run = 300

[filing]
# tier_b_min above is the quality knob: it decides which candidates are
# good enough to file at all. max_per_run is the volume knob: it caps how
# many of those pass a single run, filing the highest-scored ones first
# and holding the rest for a later run.
max_per_run = 25

[refresh]
# Rows whose metadata was never fetched, or whose score is older than
# `days`, get a fresh GET /repos/{repo}, a forced tree and README fetch,
# and a rescore. This is how Reddit-sourced rows pick up stars and
# pushed_at over time, and how any row's tier stays current as the repo
# changes. max_per_run caps how many rows refresh in one run.
days = 14
max_per_run = 50

[state]
db_path = "state/scout.db"
candidates_path = "data/candidates.jsonl"
reports_path = "reports"
